[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yscg"
version = "0.1.0"
description = "工业模型自进化系统（智训引擎赛题）：漂移监测—诊断归因—实验优化—评估上线—回滚 闭环"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "swanlab>=0.10",
    "bayesian-optimization>=1.4",
    "PyYAML>=6.0",
    "joblib>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 深度学习路线为可选：评测环境无 GPU、镜像 ≤2GB，默认不装
deep = ["tensorflow>=2.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
